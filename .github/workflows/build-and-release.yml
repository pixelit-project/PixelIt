name: Build, Release & Deploy

on: [push]

permissions:
  contents: read

concurrency:
  group: pixelit-build-${{ startsWith(github.ref, 'refs/tags/') && 'releases' || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit || github.sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refuse to change an existing release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release-error"; then
            echo '::error::This tag already has a release; published releases are not modified.'
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
      - name: Prepare and push release changelog
        id: prepare
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/prepare_tag_release.sh

  build-webui:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          repository: "pixelit-project/WebUI"

      - name: Use Node.js 💾
        uses: actions/setup-node@v7
        with:
          node-version: 19.x

      - name: Install dependencies 🔧
        run: npm install

      - name: Build WebUI 🏗️
        run: npm run build

      - name: Upload build artifacts 💾
        uses: actions/upload-artifact@v7
        with:
          name: pixelit-webui
          path: dist

  build-fw:
    needs: [prepare-release, build-webui]
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_BUILD_CACHE_DIR: ${{ github.workspace }}/.pio/cache
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.commit }}

      - name: Cache pip 💾
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-py311-v1
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO 💾
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            .pio/libdeps
          key: ${{ runner.os }}-${{ runner.arch }}-pio-deps-v1-${{ hashFiles('platformio.ini', '.github/workflows/build-and-release.yml') }}

      - name: Cache compiled objects 💾
        uses: actions/cache@v6
        with:
          path: .pio/cache
          # Cache entries are immutable; save updated objects after each run.
          key: ${{ runner.os }}-${{ runner.arch }}-pio-build-v1-${{ hashFiles('platformio.ini', 'extra_script.py', '.github/workflows/build-and-release.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pio-build-v1-${{ hashFiles('platformio.ini', 'extra_script.py', '.github/workflows/build-and-release.yml') }}-

      - name: Set up Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download WebUI artifacts 💾
        uses: actions/download-artifact@v8
        with:
          name: pixelit-webui
          path: pixelit-webui-artifact

      - name: Update webinterface.h  🔧
        run: |
          python .github/webui.py

      - name: Update version in Firmware.h 🔧
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: python .github/updateversion.py "$BUILD_VERSION"

      - name: Install pio and its dependencies 🔧
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      - name: Run PlatformIO build on selected platforms 🏗️
        run: platformio run -e ESP8266_generic -e ESP8266_nodemcuv2 -e ESP32_generic -e ESP32_d1_mini32 -e ESP8266_d1_mini -e ESP32_ulanzi -e ESP32C3_generic

      - name: Merge ESP32 firmware to single binaries 🔧
        run: |
          python .github/merge.py

      - name: Upload build artifacts 💾
        uses: actions/upload-artifact@v7
        with:
          name: pixelit-firmware
          path: .pio/build/*/firmware_*.bin

  release-fw:
    needs: [prepare-release, build-fw, deploy-webui-gh-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout prepared release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.commit }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Download artifacts 💾
        uses: actions/download-artifact@v8
        with:
          name: pixelit-firmware
          path: artifacts
      - name: Extract changelog release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/release_changelog.py notes "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish firmware with changelog notes 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
          SOURCE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        shell: bash
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" != "$SOURCE_COMMIT" ]]; then
            echo '::error::The release tag moved after the build was prepared.'
            exit 1
          fi
          shopt -s nullglob
          binaries=(artifacts/*/firmware_*.bin)
          if (( ${#binaries[@]} == 0 )); then
            echo '::error::No firmware binaries found.'
            exit 1
          fi
          args=(--verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${binaries[@]}" "${args[@]}"

  upload-fw-to-docs:
    needs: [build-fw, release-fw]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          repository: "pixelit-project/PixelIt.Docs"
          path: docs

      - name: Download artifacts 💾
        uses: actions/download-artifact@v8
        with:
          name: pixelit-firmware
          path: artifacts

      - name: Prepare binaries for web flasher 🚀
        run: |
          mkdir -p upload
          cp ./docs/src/.vuepress/public/pixelit_flasher/firmware/firmware_*.bin ./upload/
          cp -rf ./artifacts/*/firmware_*.bin ./upload/

      - name: Display structure of downloaded files 🔍
        run: ls -R ./upload/

      - name: Upload binaries to PixelIt.Docs for web flasher 🚀
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: "upload"
          destination-github-username: "pixelit-project"
          destination-repository-name: "PixelIt.Docs"
          user-email: bot@pixelit
          user-name: PixelIt Pipeline Bot
          target-branch: master
          target-directory: "src/.vuepress/public/pixelit_flasher/firmware/"
          commit-message: Pushed binaries from main repo via GitHub Actions

  deploy-webui-gh-pages:
    runs-on: ubuntu-latest
    needs: [build-webui, build-fw]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          repository: "pixelit-project/WebUI"

      - name: Download artifacts 💾
        uses: actions/download-artifact@v8
        with:
          name: pixelit-webui
          path: webui

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: . # The folder the action should deploy.
          clean: false # Automatically remove deleted files from the deploy branch
